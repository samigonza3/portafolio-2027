  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Formulario estático oculto SOLO para que el bot de build de Netlify
      lo detecte y habilite Netlify Forms (necesario porque el formulario
      real vive dentro de la SPA de React y no existe en el HTML en build
      time). No se muestra ni se usa en tiempo de ejecución: el envío real
      lo hace el componente de React vía fetch a "/".
    -->
    <form name="contacto" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="user_name" />
      <input type="email" name="user_email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <form name="reserva-mentoria" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="user_name" />
      <input type="email" name="user_email" />
      <input type="text" name="user_whatsapp" />
      <input type="text" name="slot" />
      <input type="text" name="bot-field" />
    </form>

    <form name="lead-mentoria" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="lead_name" />
      <input type="email" name="lead_email" />
      <input type="text" name="lead_country" />
      <input type="text" name="lead_whatsapp" />
      <input type="text" name="bot-field" />
    </form>
  </body>
