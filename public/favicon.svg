<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="85%">
      <stop offset="0%" stop-color="#1B2E66"/>
      <stop offset="55%" stop-color="#0B1533"/>
      <stop offset="100%" stop-color="#040817"/>
    </radialGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FA8FF"/>
      <stop offset="100%" stop-color="#3E7BFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- estrellas -->
  <g fill="#7FA8FF">
    <circle cx="96" cy="120" r="4" opacity="0.9"/>
    <circle cx="420" cy="150" r="3" opacity="0.6"/>
    <circle cx="450" cy="360" r="4" opacity="0.8"/>
    <circle cx="70" cy="380" r="3" opacity="0.7"/>
    <circle cx="410" cy="440" r="2.5" opacity="0.5"/>
    <circle cx="130" cy="440" r="2.5" opacity="0.6"/>
  </g>

  <!-- S -->
  <text x="256" y="330" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="900"
        font-size="272" fill="url(#letter)" filter="url(#glow)">S</text>
</svg>
