<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test de los 12 ejes: más allá de izquierda y derecha | Samuel González</title>
<meta name="description" content="Test político gratuito en 12 ejes con 36, 60 o 240 preguntas. Descubre tu ideología, compárate con otra persona y genera tu perfil en imagen.">
<link rel="canonical" href="https://samuelgonzalez.org/test-12-ejes/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Outfit:wght@600&display=swap" rel="stylesheet">
<style>
/* Mundo único: azul galaxia. Layout: una pantalla por paso, tarjeta central tipo typeform; resultado en columna de lectura. */
:root{
 --bg:#040817; --bg2:#070D22; --card:#0B1533; --glow:#1B2E66;
 --star:#3E7BFF; --star-light:#7FA8FF; --ink:#F4F7FF; --ink2:#C9D9FF; --muted:#8B9BC7;
 --line:rgba(127,168,255,.25); --line-strong:rgba(127,168,255,.55);
 --display:'Montserrat',system-ui,sans-serif; --label:'Outfit','Montserrat',sans-serif;
 color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(ellipse 80% 42% at 50% -4%,var(--glow),transparent 72%);background-repeat:no-repeat;background-color:var(--bg)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.08;font-weight:800}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--star-light)}
:focus-visible{outline:3px solid var(--star-light);outline-offset:3px}
.kw{color:var(--star);text-shadow:0 0 28px rgba(62,123,255,.55)}
.lab{font-family:var(--label);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--star-light)}
.wrap{max-width:980px;margin:0 auto;padding:24px 20px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 28px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand b{color:var(--star)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;transition:border-color .3s,transform .3s}
.ghost:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.primary{background:var(--star);border:0;border-radius:999px;padding:14px 26px;font-weight:700;font-size:16px;color:#fff;box-shadow:0 12px 30px -8px rgba(62,123,255,.55);transition:transform .3s,box-shadow .3s}
.primary:hover{transform:translateY(-2px);box-shadow:0 16px 36px -6px rgba(62,123,255,.7)}
.primary[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
/* intro */
.hero{padding:28px 0 12px;display:flex;flex-direction:column;gap:22px;max-width:820px}
.hero h1{font-size:clamp(38px,7vw,72px)}
.hero p{font-size:clamp(17px,2.2vw,20px);line-height:1.6;color:var(--ink2);max-width:640px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:34px}
.mode{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;transition:border-color .3s,transform .3s}
.mode:hover{border-color:var(--line-strong);transform:translateY(-4px)}
.mode.rec{border-color:var(--star)}
.mode .n{font-size:56px;font-weight:800;line-height:1}
.mode .n small{font-size:16px;font-weight:600;color:var(--ink2);margin-left:6px}
.mode p{font-size:15px;line-height:1.5;color:var(--ink2)}
.tag{display:inline-block;align-self:flex-start;font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--star-light)}
.rec .tag{background:var(--star);border-color:var(--star);color:#fff}
.go{margin-top:auto;font-weight:700;font-size:15px;color:var(--star-light)}
.chips{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:26px;color:var(--muted);font-size:14px}
.foot{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.6;max-width:760px}
/* quiz */
.bar{height:6px;background:rgba(127,168,255,.18);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--star);box-shadow:0 0 18px rgba(62,123,255,.7);transition:width .35s}
.qhead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 22px;color:var(--ink2);font-size:14px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,44px);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.qnum{font-weight:800;font-size:44px;color:rgba(127,168,255,.22);line-height:1}
.qtext{font-size:clamp(22px,3.6vw,34px);line-height:1.25;font-weight:700;margin-bottom:28px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:14px;padding:15px 18px;font-weight:600;font-size:16px;transition:border-color .25s,background .25s}
.opt:hover{border-color:var(--line-strong);background:rgba(62,123,255,.08)}
.opt[aria-pressed="true"]{border-color:var(--star);background:rgba(62,123,255,.16)}
.opt kbd{font-family:var(--label);font-weight:600;font-size:13px;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;color:var(--star-light)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.sw input{width:18px;height:18px;accent-color:#3E7BFF}
/* resultado */
.sec{margin-top:64px;display:flex;flex-direction:column;gap:20px}
.sec h2{font-size:clamp(28px,4.6vw,46px)}
.sec>p{font-size:17px;line-height:1.65;color:var(--ink2);max-width:700px}
.res-hero h1{font-size:clamp(40px,8vw,84px)}
.aff{display:flex;align-items:baseline;gap:12px;margin:6px 0 4px}
.aff b{font-size:46px;font-weight:800}
.rank{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-width:620px}
.rank div{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:15px;color:var(--ink2)}
.rank i{display:block;height:6px;background:rgba(127,168,255,.18);border-radius:9px;margin-top:5px;overflow:hidden}
.rank i s{display:block;height:100%;background:var(--star-light)}
.axrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.axgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.axtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.axtop b{font-size:17px}
.axtop span{font-family:var(--label);font-weight:600;font-size:14px;color:var(--star-light)}
.trk{position:relative;height:30px}
.trk .l{position:absolute;left:0;right:0;top:11px;height:8px;background:rgba(127,168,255,.2);border-radius:9px}
.trk .f{position:absolute;top:11px;height:8px;background:var(--star);border-radius:9px;box-shadow:0 0 18px rgba(62,123,255,.55)}
.trk .c{position:absolute;left:50%;top:5px;width:2px;height:20px;background:var(--muted)}
.trk .m{position:absolute;top:3px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--ink);border:6px solid var(--star)}
.poles{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;gap:8px}
.poles .on{color:var(--ink);font-weight:700}
/* aplanar */
.flat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px}
.stage{position:relative;height:380px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(4,8,23,.6)}
.dot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--star-light);transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1),opacity .6s,transform .6s}
.dl{position:absolute;left:12px;font-size:12px;color:var(--muted);transform:translateY(-50%);transition:opacity .5s}
.lrline{position:absolute;left:4%;right:4%;top:340px;height:2px;background:var(--line-strong);opacity:0;transition:opacity .5s}
.lrdot{position:absolute;top:340px;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--ink);border:8px solid var(--star);box-shadow:0 0 28px rgba(62,123,255,.8);opacity:0;transition:opacity .6s}
.lrends{position:absolute;left:4%;right:4%;top:352px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);opacity:0;transition:opacity .5s}
.flat.s1 .lrline,.flat.s1 .lrends{opacity:1}
.flat.s1 .dl{opacity:0}
.flat.s3 .dot{opacity:.12;transform:scale(.6)}
.flat.s3 .lrdot{opacity:1}
.verdict{display:none;flex-direction:column;gap:12px}
.flat.s3 .verdict{display:flex}
.big{font-size:clamp(26px,4vw,40px);font-weight:800;line-height:1.15}
.pill{display:inline-block;font-size:14px;font-weight:600;padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink2);margin:0 8px 8px 0}
.pill b{color:var(--ink)}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tw{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.tw h3{font-size:26px}
.tw p{font-size:15px;line-height:1.55;color:var(--ink2)}
.cmp{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.cmp div{font-size:14px;color:var(--ink2)}
.cmp b{color:var(--ink)}
.mini{position:relative;height:12px;margin:7px 0 3px}
.mini .l{position:absolute;left:0;right:0;top:4px;height:4px;background:rgba(127,168,255,.2)}
.mini .y,.mini .t{position:absolute;top:0;width:12px;height:12px;margin-left:-6px;border-radius:50%}
.mini .y{background:var(--star);border:2px solid var(--ink)}
.mini .t{background:var(--muted);border:2px solid var(--bg)}
.compass{display:flex;flex-direction:column;align-items:center;gap:12px;margin:10px auto 0;width:100%}
.cframe{width:100%;max-width:820px}
.cgrid{position:relative;aspect-ratio:1/1;width:100%;border:2px solid var(--line-strong);border-radius:14px;overflow:hidden}
.cgrid .cell{position:absolute;inset:0}
.cgrid .axv,.cgrid .axh{position:absolute;background:rgba(255,255,255,.55)}
.cgrid .axv{left:50%;top:0;bottom:0;width:2px}
.cgrid .axh{top:50%;left:0;right:0;height:2px}
.cq{position:absolute;font-family:var(--label);font-weight:600;font-size:clamp(12px,1.9vw,16px);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.92);max-width:42%;line-height:1.25;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.cdot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:2px solid rgba(4,8,23,.85);box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.cdot.tw{background:transparent;width:30px;height:30px;margin:-15px 0 0 -15px;border:3px solid #fff;box-shadow:0 0 12px rgba(255,255,255,.7)}
.cname{position:absolute;transform:translate(-50%,0);font-size:clamp(11px,1.6vw,14px);font-weight:700;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.9);white-space:nowrap;pointer-events:none}
.cme{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--ink);border:10px solid var(--star);box-shadow:0 0 0 4px #fff,0 0 34px rgba(62,123,255,.95)}
.cmelab{position:absolute;transform:translate(-50%,0);background:#fff;color:#040817;font-weight:800;font-size:clamp(12px,1.8vw,15px);padding:3px 9px;border-radius:999px}
.crow{display:flex;justify-content:space-between;width:100%;max-width:820px}
.ctl{font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--ink2);text-transform:uppercase}
.exp{display:inline-flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:16px;color:var(--ink2)}
.exp b{color:var(--ink)}
.share{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.share code{display:block;word-break:break-all;font-size:14px;color:var(--star-light);background:var(--bg2);border-radius:10px;padding:10px 12px}
.banner{background:rgba(62,123,255,.14);border:1px solid var(--star);border-radius:14px;padding:16px 18px;font-size:16px;line-height:1.5;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.cmp2 .axrow .trk .m2{position:absolute;top:3px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#F5A524;border:6px solid #fff}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px}
.jpgbox{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.jpgbox img{width:100%;max-width:520px;border-radius:12px;border:1px solid var(--line)}
.closing{margin-top:72px;padding:36px clamp(20px,4vw,48px);border:1px solid var(--star);border-radius:22px;background:radial-gradient(ellipse 90% 80% at 50% 0%,rgba(62,123,255,.25),transparent 70%),var(--card);display:flex;flex-direction:column;gap:18px}
.closing h2{font-size:clamp(30px,5.4vw,56px)}
.closing p{font-size:17px;line-height:1.65;color:var(--ink2);max-width:720px}
.pieces{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pieces span{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line-strong);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
textarea.cp{width:100%;min-height:120px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:14px;font:inherit;font-size:14px;line-height:1.5}
@media (max-width:760px){
 .modes{grid-template-columns:1fr}
 .axgrid,.cards2{grid-template-columns:1fr}
 .stage{height:340px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// Núcleo del test: datos, puntuación y proyecciones. Se usa en el navegador y en node.
var AXES = [
 {id:'estructura',n:'Estructura',a:'Federal',b:'Unitario',w:0,v:0.4},
 {id:'economia',n:'Economía',a:'Público',b:'Privado',w:1.0,v:0},
 {id:'representacion',n:'Representación',a:'Democracia',b:'Autocracia',w:0,v:1.0},
 {id:'control',n:'Control',a:'Planificación',b:'Libre mercado',w:0.9,v:0},
 {id:'poder',n:'Poder',a:'Libertad',b:'Seguridad',w:0,v:1.0},
 {id:'comercio',n:'Comercio',a:'Proteccionismo',b:'Globalismo',w:0,v:0},
 {id:'inmigracion',n:'Inmigración',a:'Multiculturalismo',b:'Asimilación',w:0.7,v:0},
 {id:'religion',n:'Religión',a:'Laicismo',b:'Religiosidad',w:0.7,v:0},
 {id:'diplomacia',n:'Diplomacia',a:'Pacifismo',b:'Militarismo',w:0.4,v:0.5},
 {id:'moral',n:'Moral',a:'Progresista',b:'Tradicionalista',w:0.9,v:0},
 {id:'intervencion',n:'Intervención',a:'No intervencionista',b:'Intervencionista',w:0.2,v:0.3},
 {id:'tecnologia',n:'Tecnología',a:'Tecnología',b:'Naturaleza',w:0,v:0}
];
// Cada eje: A = afirmaciones que favorecen el primer polo, B = las del segundo.
var BANK = {
estructura:{
A:["Las regiones deberían decidir por sí mismas buena parte de sus impuestos y su presupuesto.","Cada departamento o provincia debería poder aprobar sus propias leyes en temas locales.","Las decisiones sobre escuelas y hospitales se toman mejor cerca de la gente que los usa.","El gobierno central debería tener menos poder del que tiene hoy.","Una región debería poder organizar su propia seguridad y su propia policía.","Las ciudades grandes deberían tener más autonomía frente al gobierno nacional.","Es sano que regiones vecinas tengan reglas distintas y compitan entre sí.","Los gobernantes locales conocen mejor los problemas de su territorio que los ministros de la capital.","Los recursos de una región deberían quedarse principalmente en ella.","Un país grande funciona mejor como una unión de regiones con poder propio."],
B:["Un país debería tener las mismas leyes básicas en todo su territorio.","El gobierno nacional debería poder intervenir cuando una región maneja mal sus recursos.","Que cada región tenga reglas propias genera desigualdad entre ciudadanos del mismo país.","La educación debería seguir un currículo nacional igual para todos.","Es mejor una sola policía nacional que muchas policías locales.","Un gobierno central fuerte mantiene unido al país.","Los impuestos deberían recaudarse a nivel nacional y repartirse con criterios comunes.","Las decisiones importantes se toman con más coherencia desde un solo centro de poder.","Dar mucho poder a las regiones debilita la identidad nacional.","Los servicios públicos deberían ser iguales sin importar dónde vivas."]},
economia:{
A:["El agua, la energía y los servicios de salud deberían estar en manos del Estado.","Las empresas estratégicas, como las de energía o telecomunicaciones, deberían ser públicas.","La salud no debería ser un negocio.","Los bancos más grandes deberían estar bajo control de la sociedad.","Quienes trabajan en una empresa deberían tener voz real en cómo se dirige.","La tierra y la vivienda no deberían tratarse como mercancías para especular.","Es injusto que pocas personas concentren la propiedad de lo que produce toda la sociedad.","La educación superior debería ser pública y gratuita.","Las pensiones deberían administrarse con fondos públicos y no con administradoras privadas.","Los recursos naturales pertenecen a toda la sociedad."],
B:["Las empresas privadas administran los recursos mejor que el Estado.","La propiedad privada es la base de una sociedad próspera.","Muchas empresas estatales deberían venderse a inversionistas privados.","Cada persona debería poder elegir su colegio y su servicio de salud entre ofertas privadas.","Quien arriesga su capital merece quedarse con la ganancia sin límites.","Los servicios públicos funcionan mejor cuando compiten empresas privadas.","Un sistema de pensiones basado en cuentas individuales es más justo.","El Estado no debería ser dueño de empresas que pueden operar en el mercado.","La riqueza que alguien crea con su negocio le pertenece a él, no a la sociedad.","Privatizar suele mejorar la calidad y reducir el gasto público."]},
representacion:{
A:["Los gobernantes deberían poder ser revocados por los ciudadanos antes de terminar su mandato.","La oposición política debe tener garantías plenas, incluso cuando incomoda al gobierno.","Las decisiones importantes deberían someterse a consulta popular.","Los jueces y los medios deben ser independientes del gobierno de turno.","Es mejor un gobierno lento que decide con participación que uno rápido que decide solo.","Todos los ciudadanos deberían poder votar sin condiciones especiales.","Los ciudadanos deberían poder proponer leyes y que se sometan a votación.","Ningún líder debería permanecer en el poder sin elecciones competitivas.","Las elecciones libres son indispensables aunque den resultados que no me gustan.","Las asambleas locales deberían tener poder real de decisión."],
B:["En una crisis grave conviene que un líder fuerte decida sin tantos debates.","Demasiada participación ciudadana vuelve ineficaz al gobierno.","Algunas decisiones deberían quedar en manos de expertos y no de votaciones populares.","A veces es aceptable limitar a la oposición si pone en riesgo el orden.","Un gobierno estable por muchos años logra más que uno que cambia cada cuatro.","No todas las personas están preparadas para decidir sobre asuntos complejos del país.","Un líder con respaldo popular debería poder gobernar sin que otras instituciones lo frenen.","Los medios de comunicación deberían alinearse con el interés nacional que define el gobierno.","Es preferible un gobierno eficiente a uno muy democrático.","Las elecciones frecuentes generan más división que beneficios."]},
control:{
A:["El gobierno debería fijar precios máximos en los bienes esenciales.","El Estado debería decidir en qué sectores invertir para desarrollar el país.","Una economía sin planificación termina en crisis recurrentes.","El gobierno debería regular con firmeza los alquileres.","Las grandes empresas deberían cumplir metas fijadas por el Estado, como empleo o emisiones.","El Estado debe corregir al mercado cuando produce resultados injustos.","Los sectores clave necesitan un plan nacional a largo plazo.","Sin regulación fuerte, los mercados terminan dominados por monopolios.","El gobierno debería subir el salario mínimo con regularidad.","El gobierno debería dirigir el crédito hacia lo que el país necesita."],

function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rnd){for(var i=arr.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
// Construye las preguntas de una versión: por eje se alternan polos y se parte desde un polo distinto en ejes pares e impares.
function buildQuiz(mode,rnd){
 var per=MODES[mode].per,out=[];
 AXES.forEach(function(ax,i){
  var A=BANK[ax.id].A,B=BANK[ax.id].B,list=[];
  var first=(i%2===0)?'A':'B';
  for(var k=0;k<10;k++){
   var pair=first==='A'?[['A',A[k]],['B',B[k]]]:[['B',B[k]],['A',A[k]]];
   list.push(pair[0],pair[1]);
  }
  list.slice(0,per).forEach(function(q){out.push({axis:i,pole:q[0]==='A'?-1:1,t:q[1]});});
 });
 return shuffle(out,rnd||Math.random);
}
// Puntaje por eje en [-1,1]: negativo = primer polo, positivo = segundo polo.
function score(quiz,answers){
 var sum=new Array(12).fill(0),cnt=new Array(12).fill(0);
 quiz.forEach(function(q,i){
  if(answers[i]===undefined||answers[i]===null)return;
  sum[q.axis]+=q.pole*answers[i];cnt[q.axis]+=1;
 });
 return sum.map(function(s,i){return cnt[i]?Math.max(-1,Math.min(1,s/(2*cnt[i]))):0;});
}
function dot(a,b){var s=0;for(var i=0;i<a.length;i++)s+=a[i]*b[i];return s;}
function norm(a){return Math.sqrt(dot(a,a));}
function lrScore(s){var w=AXES.map(function(a){return a.w;});var den=w.reduce(function(x,y){return x+Math.abs(y);},0);return dot(w,s)/den;}
function lrLabel(x){return x<-0.45?'Izquierda':x<-0.12?'Centro-izquierda':x<=0.12?'Centro':x<=0.45?'Centro-derecha':'Derecha';}
function authScore(s){var v=AXES.map(function(a){return a.v;});var den=v.reduce(function(x,y){return x+Math.abs(y);},0);return dot(v,s)/den;}
// Porcentaje del perfil que queda fuera de una dirección o de un plano.
function lostLine(s){var w=AXES.map(function(a){return a.w;});var n=norm(s);if(n<1e-9)return 0;var u=norm(w);var p=dot(s,w)/u;return Math.max(0,1-(p*p)/(n*n));}
function lostPlane(s){
 var w=AXES.map(function(a){return a.w;}),v=AXES.map(function(a){return a.v;});
 var e1=w.map(function(x){return x/norm(w);});
 var d=dot(v,e1);var r=v.map(function(x,i){return x-d*e1[i];});var e2=r.map(function(x){return x/norm(r);});
 var n=norm(s);if(n<1e-9)return 0;var p1=dot(s,e1),p2=dot(s,e2);
 return Math.max(0,1-(p1*p1+p2*p2)/(n*n));
}
function distance(a,b){var s=0;for(var i=0;i<a.length;i++){var d=a[i]-b[i];s+=d*d;}return Math.sqrt(s/a.length);}
function affinity(s,v){return Math.max(0,Math.round(100*(1-distance(s,v)/1.0)));}

  var rej=ord.slice(0,3).map(function(o){return (o.v<0?o.a.b:o.a.a)+' ('+o.a.n+')';});
  var bal=ord.slice(-2).map(function(o){return o.a.n;}).join(' y ');
  var col=function(tt,arr,px,py,col2){x.fillStyle=col2;x.font='600 24px '+F;x.fillText(tt,px,py);x.fillStyle='#F4F7FF';x.font='600 26px '+F;var yy=py+40;arr.forEach(function(l){wrapText(x,l,440).forEach(function(z){x.fillText(z,px,yy);yy+=34;});yy+=6;});};
  col('DEFIENDE',def,64,y,'#2FBF71');col('SE ALEJA DE',rej,576,y,'#E5484D');
  y+=210;x.fillStyle='#8B9BC7';x.font='500 24px '+F;x.fillText('Ejes donde duda: '+bal,64,y);y+=48;
  // barras
  var by=y,rowH=30;
  ord=AXES.map(function(a,i){return {a:a,v:s[i]};});
  ord.forEach(function(o,k){var yy=by+k*rowH+(k*0);x.fillStyle='#C9D9FF';x.font='600 22px '+F;x.fillText(o.a.n,64,yy);
   var bx=250,bw=330;x.fillStyle='rgba(127,168,255,.2)';x.fillRect(bx,yy+8,bw,10);x.fillStyle='#3E7BFF';var p=(o.v+1)/2*bw;x.fillRect(Math.min(bx+bw/2,bx+p),yy+8,Math.abs(p-bw/2),10);x.fillStyle='#fff';x.beginPath();x.arc(bx+p,yy+13,9,0,6.283);x.fill();
  });
  // mini brújula
  var cx=640,cy=by-4,cs=376;
  var N=32;for(var r=0;r<N;r++)for(var c=0;c<N;c++){x.fillStyle=qcol((c+.5)/N,1-(r+.5)/N);x.fillRect(cx+c*cs/N,cy+r*cs/N,cs/N+1,cs/N+1);}
  x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=2;x.beginPath();x.moveTo(cx+cs/2,cy);x.lineTo(cx+cs/2,cy+cs);x.moveTo(cx,cy+cs/2);x.lineTo(cx+cs,cy+cs/2);x.stroke();x.strokeRect(cx,cy,cs,cs);
  var pt=function(l,a){return [cx+(l+1)/2*cs,cy+(1-(a+1)/2)*cs];};
  IDEOLOGIES.forEach(function(gg){var p=pt(lrScore(gg.v),authScore(gg.v));x.fillStyle='#fff';x.beginPath();x.arc(p[0],p[1],5,0,6.283);x.fill();});
  var me=pt(lrScore(s),authScore(s));x.fillStyle='#3E7BFF';x.strokeStyle='#fff';x.lineWidth=5;x.beginPath();x.arc(me[0],me[1],16,0,6.283);x.fill();x.stroke();
  x.fillStyle='#fff';x.font='700 20px '+F;x.fillText('Izquierda',cx,cy+cs+8);var tw2=x.measureText('Derecha').width;x.fillText('Derecha',cx+cs-tw2,cy+cs+8);
  var fy=by+12*rowH+30;fy=Math.max(fy,cy+cs+50);
  x.fillStyle='#F4F7FF';x.font='800 34px '+F;wrapText(x,'La línea izquierda-derecha deja fuera el '+Math.round(lostLine(s)*100)+'% de mi perfil.',W-128).forEach(function(l){x.fillText(l,64,fy);fy+=44;});
  x.fillStyle='#7FA8FF';x.font='600 24px '+F;x.fillText('Test de los 12 ejes · compara tu código: '+(S.code||''),64,H-76);
  return cv.toDataURL('image/jpeg',0.92);
 }
 function buildStage(s){
  var st=document.getElementById('stage');if(!st)return;
  var h=st.clientHeight||380,rowH=(h-90)/12,html='';
  AXES.forEach(function(a,i){
   var y=24+i*rowH;
   html+='<span class="dl" style="top:'+y+'px">'+esc(a.n)+'</span><span class="dot" data-i="'+i+'" style="left:'+(((s[i]+1)/2)*86+7)+'%;top:'+y+'px"></span>';
  });
  var lr=lrScore(s);
  html+='<div class="lrline"></div><div class="lrends"><span>Izquierda</span><span>Derecha</span></div><span class="lrdot" id="lrdot" style="left:'+(((lr+1)/2)*86+7)+'%;"></span>';
  st.innerHTML=html;
  S.stageH=h;S.stageLR=((lr+1)/2)*86+7;
 }

 function flatten(){
  var box=document.getElementById('flat'),btn=document.getElementById('flatbtn');if(!box||box.classList.contains('s3'))return;
  btn.disabled=true;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lineY=340;
  var dots=[].slice.call(document.querySelectorAll('#stage .dot'));
  var step=function(){
   box.classList.add('s1');
   dots.forEach(function(d){d.style.top=lineY+'px';});
  };
  var conv=function(){dots.forEach(function(d){d.style.left=S.stageLR+'%';});};
  var fin=function(){box.classList.add('s3');btn.style.display='none';};
  if(reduce){step();conv();fin();return;}
  step();setTimeout(conv,1000);setTimeout(fin,1900);
 }

 function next(){
  if(S.answers[S.idx]===undefined)return;
  if(S.idx>=S.quiz.length-1){S.vec=score(S.quiz,S.answers);S.screen='result';S.shared=false;result();toTop();return;}
  S.idx++;quiz();toTop();
 }
 function pick(v){
  S.answers[S.idx]=v;
  var cur=S.idx;
  if(S.auto){quiz();setTimeout(function(){if(S.screen==='quiz'&&S.idx===cur)next();},260);}
  else quiz();
 }
 function start(m){
  S.mode=m;S.shared=false;S.quiz=buildQuiz(m);S.answers=[];S.idx=0;S.screen='quiz';S.copyFallback='';quiz();toTop();
 }
 function copy(){
  var t=S.copyText||'';
  var done=function(){S.copyFallback='';var b=document.querySelector('[data-a="copy"]');if(b)b.textContent='Copiado';};
  var fail=function(){S.copyFallback=t;result();var ta=document.getElementById('cp');if(ta){ta.focus();ta.select();}};
  try{
   if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fail);}else fail();
  }catch(e){fail();}
 }
 app.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a');
  if(a==='start')start(el.getAttribute('data-m'));
  else if(a==='ans')pick(parseInt(el.getAttribute('data-v'),10));
  else if(a==='next')next();
  else if(a==='back'){if(S.idx>0){S.idx--;quiz();}}
  else if(a==='home'){if(el.getAttribute('data-keep')&&S.shared){S.vs=S.vec;}else if(!el.getAttribute('data-keep')){S.vs=S.vs&&S.shared?S.vs:S.vs;}S.screen='intro';S.shared=false;try{history.replaceState(null,'',location.href.split('#')[0]+(S.vs?'':''));}catch(e){}intro();toTop();}
  else if(a==='compare'){var inp=document.getElementById('vsin'),er=document.getElementById('vserr'),d=decodeVec(inp?inp.value:'');if(!d){if(er)er.textContent='No reconozco ese código. Pega el link completo o el código de 25 caracteres.';return;}S.vs=d.s;var y0=window.scrollY||0;result();var cs=document.querySelector('.cmp2');if(cs&&cs.scrollIntoView)try{cs.scrollIntoView();}catch(e){}}
  else if(a==='jpg'){var o=document.getElementById('jpgout');try{var u=makeJpg();o.innerHTML='<img alt="Perfil político en imagen" src="'+u+'"><p style="color:var(--ink2);font-size:14px;margin:10px 0">En el celular mantén presionada la imagen para guardarla. En computador, clic derecho y guardar imagen.</p>';}catch(err){o.textContent='No se pudo generar la imagen en este navegador.';}}
  else if(a==='flat')flatten();
  else if(a==='copy')copy();
 });
 app.addEventListener('change',function(e){if(e.target&&e.target.id==='auto')S.auto=e.target.checked;});
 document.addEventListener('keydown',function(e){
  if(S.screen!=='quiz')return;
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(e.key>='1'&&e.key<='5'){pick(LEVELS[parseInt(e.key,10)-1].v);}
  else if(e.key==='ArrowLeft'||e.key==='Backspace'){if(S.idx>0){S.idx--;quiz();}}
  else if(e.key==='Enter'||e.key==='ArrowRight'){next();}
 });
 var h='';try{h=location.hash||'';}catch(e){}
 var dd=decodeVec(h);
 if(dd&&/r=/.test(h)){S.vec=dd.s;S.mode=dd.mode;S.shared=true;S.screen='result';result();}else intro();
})();
</script>
